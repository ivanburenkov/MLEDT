<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MLEDT: Continuous Solver</title>
    
    <script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>

    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; max-width: 1500px; margin: 0 auto; padding: 20px; color: #333; background-color: #f4f7f6; }
        h1 { border-bottom: 2px solid #0056b3; padding-bottom: 10px; color: #0056b3; }
        .dashboard { display: grid; grid-template-columns: 380px 1fr 1.2fr; gap: 20px; margin-top: 20px; }
        .panel { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .plot-container { width: 100%; height: 380px; background: #fafafa; border: 1px solid #eee; border-radius: 4px; margin-bottom: 15px; }
        .form-group { margin-bottom: 12px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 13px; }
        input[type="number"], input[type="file"] { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        .btn-group { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
        button { border: none; padding: 12px; cursor: pointer; border-radius: 4px; font-size: 15px; width: 100%; font-weight: bold; }
        #btn-init { background: #6c757d; color: white; }
        #btn-run { background: #28a745; color: white; }
        #btn-stop { background: #dc3545; color: white; }
        button:disabled { background: #ccc !important; cursor: not-allowed; }
        .log-area { width: 100%; height: 180px; background: #1e1e1e; color: #00ff00; padding: 10px; overflow-y: auto; font-family: 'Courier New', monospace; font-size: 12px; margin-top: 10px; border-radius: 4px; border: 1px solid #333; }
    </style>
</head>
<body>

    <h1>Maximum Likelihood Estimation: Detector Tomography</h1>

    <div class="dashboard">
        <div class="panel">
            <h3>Configuration</h3>
            
            <div class="form-group">
                <label>Experimental Data File (.txt / .dat)</label>
                <input type="file" id="data-file" accept=".txt,.dat">
            </div>

            <div class="form-group">
                <label>Max Photons in Model (N)</label>
                <input type="number" id="max-n" value="20">
            </div>

            <div style="display: flex; gap: 10px;">
                <div class="form-group" style="flex:1">
                    <label>Max Iterations</label>
                    <input type="number" id="total-iter" value="100">
                </div>
                <div class="form-group" style="flex:1">
                    <label>Update Rate (Steps)</label>
                    <input type="number" id="update-rate" value="5">
                </div>
            </div>

            <div class="btn-group">
                <button id="btn-init">1. Initialize Engine</button>
                <button id="btn-run" disabled>2. Start Calculation</button>
                <button id="btn-stop" disabled>Stop / Reset</button>
            </div>
            
            <div id="log-output" class="log-area">Status: Waiting for initialization...</div>
        </div>

        <div class="panel">
            <div id="plot-fit" class="plot-container"></div>
            <div id="plot-mse" class="plot-container"></div>
        </div>

        <div class="panel">
            <div id="plot-heat" class="plot-container" style="height: 780px;"></div>
        </div>
    </div>

    <script id="worker-code" type="javascript/worker">
        importScripts("https://cdn.jsdelivr.net/pyodide/v0.25.1/full/pyodide.js");
        let pyodide;

        const pythonMLE = `
import numpy as np
from scipy.optimize import minimize
import math

def Fexperiment(mean_photon_numbers, k):
    # Construct Poisson matrix for detector response
    F = np.zeros((len(mean_photon_numbers), k + 1))
    for j1, mu in enumerate(mean_photon_numbers):
        for j2 in range(k + 1):
            F[j1, j2] = np.exp(-mu) * (mu**j2) / math.factorial(j2)
    F[:, -1] = 1.0 - np.sum(F[:, :-1], axis=1)
    return np.clip(F, 1e-15, 1.0)

def logL(Pi_init_flat, PMeas, F, n_outcomes, Npulses):
    k = int(len(Pi_init_flat)/n_outcomes)
    Pi = np.reshape(Pi_init_flat, (k, n_outcomes), order='F')
    expected = (F @ Pi) * Npulses
    # Log-likelihood objective function
    lL = -np.sum(PMeas * np.log(expected + 1e-10))
    out = lL / (F.shape[0] * Npulses)
    return 10000.0 if np.isnan(out) else out

def diff_P(Pi_init_flat, PMeas, F, n_outcomes, Npulses):
    k = int(len(Pi_init_flat)/n_outcomes)
    Pi = np.reshape(Pi_init_flat, (k, n_outcomes), order='F')
    return np.mean(((PMeas/Npulses) - (F @ Pi))**2)

def run_continuous_mle(P_list, alpha_list, n_outcomes, k, Npulses, max_iter, update_rate, js_post_message):
    P = np.array(P_list).reshape((-1, n_outcomes))
    F = Fexperiment(np.array(alpha_list), k)
    x0 = (np.ones((k + 1, n_outcomes)) / n_outcomes).flatten(order='F')

    def constraint(x):
        # Probability normalization constraint
        Pi = np.reshape(x, (k+1, n_outcomes), order='F')
        return np.sum(Pi, 1) - 1.0

    def iteration_callback(xk, state):
        # UI Bridge: Sends current state back to main thread based on update rate
        if int(state.nit) % update_rate == 0:
            mse = diff_P(xk, P, F, n_outcomes, Npulses)
            PiOut = np.reshape(xk, (k + 1, n_outcomes), order='F')
            expected = (F @ PiOut) * Npulses
            js_post_message(xk.tolist(), expected.flatten().tolist(), float(mse), int(state.nit))
        return False

    # Execute synchronous SciPy minimize
    res = minimize(logL, x0, args=(P, F, n_outcomes, Npulses),
                   method='trust-constr', 
                   options={'maxiter': max_iter, 'verbose': 0}, 
                   bounds=[(0,1)]*len(x0), 
                   constraints={'type': 'eq', 'fun': constraint},
                   callback=iteration_callback)
    
    # Final state update
    final_mse = diff_P(res.x, P, F, n_outcomes, Npulses)
    PiOut_f = np.reshape(res.x, (k + 1, n_outcomes), order='F')
    expected_f = (F @ PiOut_f) * Npulses
    js_post_message(res.x.tolist(), expected_f.flatten().tolist(), float(final_mse), int(res.nit))
    return True
`;

        self.onmessage = async function(e) {
            const data = e.data;
            if (data.type === 'init') {
                self.postMessage({type: 'log', msg: 'Waking up Python engine...'});
                pyodide = await loadPyodide();
                await pyodide.loadPackage(['numpy', 'scipy']);
                await pyodide.runPythonAsync(pythonMLE);
                self.postMessage({type: 'ready'});
            } 
            else if (data.type === 'run') {
                const js_callback = (xk, expected, mse, iterNum) => {
                    self.postMessage({ type: 'progress', xk: xk.toJs(), expected: expected.toJs(), mse: mse, iteration: iterNum });
                };
                pyodide.globals.get("run_continuous_mle")(
                    data.counts, data.alphas, data.maxC + 1, data.maxN, data.npulses, 
                    data.iters, data.updateRate, js_callback
                );
                self.postMessage({type: 'done'});
            }
        };
    </script>

    <script>
        let parsedAlphas, parsedCounts, currentMaxC = 0, extractedNpulses = 1;
        let worker;

        const logMsg = (m) => {
            const e = document.getElementById('log-output');
            e.innerText += `\n[${new Date().toLocaleTimeString()}] ${m}`;
            e.scrollTop = e.scrollHeight;
        };

        function createWorker() {
            const blob = new Blob([document.getElementById('worker-code').textContent], {type: 'application/javascript'});
            worker = new Worker(URL.createObjectURL(blob));

            worker.onmessage = function(e) {
                const msg = e.data;
                if (msg.type === 'log') logMsg(msg.msg);
                else if (msg.type === 'ready') {
                    logMsg("Engine Ready. Upload data to begin.");
                    document.getElementById('btn-init').disabled = true;
                    if(parsedCounts) document.getElementById('btn-run').disabled = false;
                } 
                else if (msg.type === 'progress') updateUI(msg.xk, msg.expected, msg.mse, msg.iteration);
                else if (msg.type === 'done') {
                    logMsg("Convergence reached.");
                    document.getElementById('btn-run').disabled = false;
                    document.getElementById('btn-stop').disabled = true;
                }
            };
        }

        // Initialize first worker on load
        createWorker();

        document.getElementById('btn-init').onclick = () => {
            document.getElementById('btn-init').disabled = true;
            worker.postMessage({ type: 'init' });
        };

        document.getElementById('data-file').onchange = (e) => {
            const reader = new FileReader();
            reader.onload = (ev) => {
                const tokens = ev.target.result.trim().split(/\s+/).filter(Boolean).map(Number);
                let idx = 0;
                currentMaxC = tokens[idx++];
                const numA = tokens[idx++];
                parsedAlphas = [];
                for(let i=0; i<numA; i++) parsedAlphas.push(tokens[idx++]);
                parsedCounts = [];
                for(let i=0; i<numA*(currentMaxC+1); i++) parsedCounts.push(tokens[idx++]);
                
                // Calculate Npulses from first attenuation sum
                let firstAlphaSum = 0;
                for(let c=0; c <= currentMaxC; c++) firstAlphaSum += parsedCounts[c];
                extractedNpulses = firstAlphaSum;
                
                logMsg(`Data loaded: ${numA} attenuations. Npulses ≈ ${extractedNpulses}`);
                initPlots(currentMaxC, numA);
                if(document.getElementById('btn-init').disabled) document.getElementById('btn-run').disabled = false;
            };
            reader.readAsText(e.target.files[0]);
        };

        function initPlots(maxC, numA) {
            const traces = [];
            for(let c=0; c<=maxC; c++) {
                const y = [];
                for(let i=0; i<numA; i++) y.push(parsedCounts[i*(maxC+1)+c]);
                traces.push({ x: parsedAlphas, y: y, mode: 'markers', name: `Exp c=${c}` });
                traces.push({ x: parsedAlphas, y: new Array(numA).fill(0), mode: 'lines', name: `Fit c=${c}`, line: {dash:'dot'} });
            }
            Plotly.newPlot('plot-fit', traces, { title: 'Experimental Counts vs Fit', margin: {t:40}, xaxis: {title:'Alpha'}, yaxis: {title:'Counts'} });
            Plotly.newPlot('plot-mse', [{ x: [], y: [], mode: 'lines+markers', name: 'MSE', line:{color:'#d63384'} }], { title: 'Log-MSE Convergence', yaxis: {type:'log'}, margin: {t:40} });
            Plotly.newPlot('plot-heat', [{ z: [[]], type: 'heatmap', colorscale: 'Viridis' }], { title: 'POVM Reconstruction (Order: F)', margin: {t:40} });
        }

        function updateUI(flatX, fitFlat, mse, iterNum) {
            const maxN = parseInt(document.getElementById('max-n').value);
            const n_outcomes = currentMaxC + 1;
            const k_plus_1 = maxN + 1;

            const z = [];
            for(let c=0; c < n_outcomes; c++) {
                let row = [];
                for(let n=0; n < k_plus_1; n++) row.push(flatX[c * k_plus_1 + n]);
                z.push(row);
            }
            Plotly.restyle('plot-heat', { z: [z] });
            Plotly.extendTraces('plot-mse', { x: [[iterNum]], y: [[mse]] }, [0]);

            const fitY = [], fitIdx = [];
            for(let c=0; c < n_outcomes; c++) {
                const row = [];
                for(let a=0; a < parsedAlphas.length; a++) row.push(fitFlat[a * n_outcomes + c]);
                fitY.push(row); fitIdx.push((c*2)+1);
            }
            Plotly.restyle('plot-fit', { y: fitY }, fitIdx);
            logMsg(`Step ${iterNum} | MSE: ${mse.toExponential(4)}`);
        }

        document.getElementById('btn-stop').onclick = () => {
            worker.terminate();
            logMsg("Worker Terminated. Engine reset required.");
            document.getElementById('btn-stop').disabled = true;
            document.getElementById('btn-run').disabled = true;
            document.getElementById('btn-init').disabled = false;
            createWorker();
        };

        document.getElementById('btn-run').onclick = () => {
            document.getElementById('btn-run').disabled = true;
            document.getElementById('btn-stop').disabled = false;
            worker.postMessage({
                type: 'run',
                counts: Array.from(parsedCounts),
                alphas: Array.from(parsedAlphas),
                maxC: currentMaxC,
                maxN: parseInt(document.getElementById('max-n').value),
                npulses: extractedNpulses,
                iters: parseInt(document.getElementById('total-iter').value),
                updateRate: parseInt(document.getElementById('update-rate').value)
            });
        };
    </script>
</body>
</html>
