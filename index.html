<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MLEDT: Trust-Region Iterative Solver</title>
    
    <script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/pyodide/v0.25.1/full/pyodide.js"></script>

    <style>
        body { font-family: 'Segoe UI', sans-serif; max-width: 1500px; margin: 0 auto; padding: 20px; color: #333; background-color: #f4f7f6; }
        h1 { border-bottom: 2px solid #d63384; padding-bottom: 10px; color: #d63384; }
        .dashboard { display: grid; grid-template-columns: 380px 1fr 1.2fr; gap: 20px; margin-top: 20px; }
        .panel { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .plot-container { width: 100%; height: 380px; background: #fafafa; border: 1px solid #eee; border-radius: 4px; margin-bottom: 15px; }
        .form-group { margin-bottom: 12px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 13px; }
        input[type="number"], input[type="file"] { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { border: none; padding: 12px; cursor: pointer; border-radius: 4px; font-size: 15px; width: 100%; font-weight: bold; margin-bottom: 10px; }
        #btn-init { background: #0056b3; color: white; }
        #btn-run { background: #28a745; color: white; }
        #btn-stop { background: #dc3545; color: white; }
        button:disabled { background: #ccc !important; cursor: not-allowed; }
        .log-area { width: 100%; height: 150px; background: #1e1e1e; color: #00ff00; padding: 10px; overflow-y: auto; font-family: monospace; font-size: 12px; margin-top: 10px; border-radius: 4px; }
    </style>
</head>
<body>

    <h1>MLE Detector Tomography (Trust-Region)</h1>

    <div class="dashboard">
        <div class="panel">
            <h3>Controls</h3>
            <button id="btn-init">1. Initialize Engine</button>
            
            <div class="form-group">
                <label>Experimental Data File</label>
                <input type="file" id="data-file" accept=".txt,.dat" disabled>
            </div>

            <div style="display: flex; gap: 10px;">
                <div class="form-group" style="flex:1">
                    <label>Max Photons (N)</label>
                    <input type="number" id="max-n" value="20">
                </div>
                <div class="form-group" style="flex:1">
                    <label>Pulses (Npulses)</label>
                    <input type="number" id="num-pulses" value="1">
                </div>
            </div>

            <div class="form-group">
                <label>Max Iterations</label>
                <input type="number" id="max-iter" value="100">
            </div>

            <button id="btn-run" disabled>2. Start MLE Solver</button>
            <button id="btn-stop" disabled>Stop</button>
            
            <div id="log-output" class="log-area">Ready...</div>
        </div>

        <div class="panel">
            <div id="plot-fit" class="plot-container"></div>
            <div id="plot-mse" class="plot-container"></div>
        </div>

        <div class="panel">
            <div id="plot-heat" class="plot-container" style="height: 780px;"></div>
        </div>
    </div>

    <script>
        let pyodide, parsedAlphas, parsedCounts, isRunning = false, currentMaxC = 0;

        const logMsg = (m) => {
            const e = document.getElementById('log-output');
            e.innerText += `\n[${new Date().toLocaleTimeString()}] ${m}`;
            e.scrollTop = e.scrollHeight;
        };

        // Redefining your Python logic for the WASM environment
        const pythonCode = `
import numpy as np
from scipy.optimize import minimize
import math

def coherentStateProb(alpha, k):
    return np.exp(-alpha**2) * (alpha**(2*k)) / math.factorial(k)

def Fexperiment(mean_photon_numbers, k):
    F = np.zeros((len(mean_photon_numbers), k + 1))
    for j1, mu in enumerate(mean_photon_numbers):
        for j2 in range(k + 1):
            F[j1, j2] = coherentStateProb(np.sqrt(mu), j2)
    F[:, -1] = 1.0 - np.sum(F[:, :-1], axis=1)
    return F
def logL(Pi_init_flat, PMeas, F, mean_photon_numbers, n_outcomes, Npulses):
    lL = 0
    k = int(len(Pi_init_flat)/n_outcomes)
    Pi = np.reshape(Pi_init_flat, (k, n_outcomes), order = 'F')
    for s, mean_photon_number in enumerate(mean_photon_numbers):
        for outcome in range(n_outcomes):
            F_si = F[s, :]
            Pi_in = Pi[:, int(outcome)]
            P_sn = PMeas[s, outcome]
            lL -= P_sn*np.log(F_si@Pi_in+1e-10)
    out = lL/len(mean_photon_numbers)/Npulses
    if np.isnan(out):
        out = 10000
    return out

#def logL(Pi_flat, PMeas, F, mean_photon_numbers, n_outcomes, Npulses):
#    k = int(len(Pi_flat) / n_outcomes)
#    Pi = np.reshape(Pi_flat, (k, n_outcomes), order='F')
#    expected = (F @ Pi) * Npulses
#    return -np.sum(PMeas * np.log(expected + 1e-10))

def diff_P(Pi_flat, PMeas, F, mean_photon_numbers, n_outcomes, Npulses):
    k = int(len(Pi_flat) / n_outcomes)
    Pi = np.reshape(Pi_flat, (k, n_outcomes), order='F')
    return np.mean(((PMeas/Npulses) - (F @ Pi))**2)

def maxLikelihoodEstimate_wasm(P_list, mean_photon_numbers_list, n_outcomes, k, Npulses, maxiter, js_callback):
    P = np.array(P_list).reshape((-1, n_outcomes))
    mean_photon_numbers = np.array(mean_photon_numbers_list)
    F = Fexperiment(mean_photon_numbers, k)
    
    Pi_init = np.ones((k + 1, n_outcomes)) * (1.0 / n_outcomes)
    Pi_init_flat = Pi_init.flatten()

    def internal_callback(xk, state):
        mse = diff_P(xk, P, F, mean_photon_numbers, n_outcomes, Npulses)
        # Update the UI via JS callback
        js_callback(xk.tolist(), float(mse))
        return False

    def constraint(x, n_outcomes):
        Pi = np.reshape(x, [int(len(x)/n_outcomes), n_outcomes], order='F')
        return (np.sum(Pi, 1) - 1.0)

    cons = ({'type': 'eq', 'fun': constraint, 'args': (n_outcomes,)})
    res = minimize(logL, Pi_init_flat, args=(P, F, mean_photon_numbers, n_outcomes, Npulses),
                   method='trust-constr', options={'maxiter': maxiter}, 
                   bounds=[(0,1)]*len(Pi_init_flat), constraints=cons, callback=internal_callback)
    
    PiOut = np.reshape(res.x, (k + 1, n_outcomes), order='F')
    expected = (F @ PiOut) * Npulses
    return {"x": res.x.tolist(), "expected": expected.flatten().tolist(), "mse": float(res.fun)}
`;

        document.getElementById('btn-init').onclick = async () => {
            logMsg("Loading Pyodide & Scipy...");
            pyodide = await loadPyodide();
            await pyodide.loadPackage(['numpy', 'scipy']);
            await pyodide.runPythonAsync(pythonCode);
            logMsg("MLE Engine Ready.");
            document.getElementById('data-file').disabled = false;
        };

        document.getElementById('data-file').onchange = (e) => {
            const reader = new FileReader();
            reader.onload = (ev) => {
                const tokens = ev.target.result.trim().split(/\s+/).filter(Boolean).map(Number);
                let idx = 0;
                currentMaxC = tokens[idx++];
                const numA = tokens[idx++];
                parsedAlphas = [];
                for(let i=0; i<numA; i++) parsedAlphas.push(tokens[idx++]);
                parsedCounts = [];
                for(let i=0; i<numA*(currentMaxC+1); i++) parsedCounts.push(tokens[idx++]);
                initPlots(currentMaxC, numA);
                document.getElementById('btn-run').disabled = false;
                logMsg("Data Loaded.");
            };
            reader.readAsText(e.target.files[0]);
        };

        function initPlots(maxC, numA) {
            const traces = [];
            for(let c=0; c<=maxC; c++) {
                const y = [];
                for(let i=0; i<numA; i++) y.push(parsedCounts[i*(maxC+1)+c]);
                traces.push({ x: parsedAlphas, y: y, mode: 'markers', name: `Exp c=${c}` });
                traces.push({ x: parsedAlphas, y: new Array(numA).fill(0), mode: 'lines', name: `Fit c=${c}`, line: {dash:'dot'} });
            }
            Plotly.newPlot('plot-fit', traces, { title: 'Fit Results' });
            Plotly.newPlot('plot-mse', [{ x: [], y: [], mode: 'lines+markers', name: 'MSE' }], { title: 'MSE Convergence', yaxis: {type: 'log'} });
            Plotly.newPlot('plot-heat', [{ z: Array.from({length: maxC+1}, () => new Array(21).fill(0)), type: 'heatmap' }], { title: 'POVM Heatmap' });
        }

        let iterCount = 0;
        function updateUI(flatX, mse) {
            iterCount++;
            const maxN = parseInt(document.getElementById('max-n').value);
            const z = [];
            for(let c=0; c<=currentMaxC; c++) {
                let row = [];
                for(let n=0; n<=maxN; n++) row.push(flatX[n*(currentMaxC+1) + c]);
                z.push(row);
            }
            Plotly.restyle('plot-heat', { z: [z] });
            Plotly.extendTraces('plot-mse', { x: [[iterCount]], y: [[mse]] }, [0]);
        }

        document.getElementById('btn-run').onclick = async () => {
            isRunning = true; iterCount = 0;
            document.getElementById('btn-run').disabled = true;
            const maxN = parseInt(document.getElementById('max-n').value);
            const pulses = parseInt(document.getElementById('num-pulses').value);
            const mIter = parseInt(document.getElementById('max-iter').value);

            logMsg("Starting trust-region optimization...");
            const result = await pyodide.globals.get("maxLikelihoodEstimate_wasm")(
                Array.from(parsedCounts), Array.from(parsedAlphas), currentMaxC + 1, maxN, pulses, mIter, updateUI
            );
            
            const resJs = result.toJs();
            const fitFlat = resJs.get('expected'), fitY = [], fitIdx = [];
            for(let c=0; c<=currentMaxC; c++) {
                const row = [];
                for(let a=0; a<parsedAlphas.length; a++) row.push(fitFlat[a*(currentMaxC+1)+c]);
                fitY.push(row); fitIdx.push((c*2)+1);
            }
            Plotly.restyle('plot-fit', { y: fitY }, fitIdx);
            logMsg("Optimization Complete.");
            document.getElementById('btn-run').disabled = false;
        };
    </script>
</body>
</html>
